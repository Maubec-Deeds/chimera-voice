# Builds the Windows release zip whenever a version tag (v1.2.3) is pushed, and attaches it to
# that tag's GitHub release (creating the release if it is not there yet). Can also be started by
# hand from the Actions tab, which leaves the zip as a downloadable build artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-voice-windows
          path: dist/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Chimera Voice $($tag.TrimStart('v'))" --notes "See READ ME FIRST.txt in the zip." }
          gh release upload $tag (Get-ChildItem dist/*.zip).FullName --clobber
